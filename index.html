<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zhiyang Hu - Homepage</title>
    <meta name="description" content="Personal academic homepage of Zhiyang Hu.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="cursor-glow"></div>

    <header>
        <nav class="container">
            <a href="#home" class="logo">Zhiyang Hu</a>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#news">News</a></li>
                <li><a href="#publications">Publications</a></li>
                <li><a href="#contact">Contact</a></li>
                <li><button id="theme-toggle"><i class="fas fa-moon"></i></button></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home" class="hero-section">
            <div class="container hero-content">
                <!-- Injected via JS -->
            </div>
            <div class="scroll-down">
                <i class="fas fa-chevron-down"></i>
            </div>
        </section>

        <section id="about" class="section">
            <div class="container">
                <h2 class="section-title">About Me</h2>
                <div id="about-content" class="about-grid">
                    <!-- Injected via JS -->
                </div>
            </div>
        </section>

        <section id="news" class="section">
            <div class="container">
                <h2 class="section-title">Recent News</h2>
                <div id="news-list" class="news-container">
                    <!-- Injected via JS -->
                </div>
            </div>
        </section>

        <section id="publications" class="section">
            <div class="container">
                <h2 class="section-title">Selected Publications</h2>
                <div id="publication-list" class="papers-grid">
                    <!-- Injected via JS -->
                </div>
            </div>
        </section>

        <section id="contact" class="section footer-section">
            <div class="container">
                <h2 class="section-title">Get in Touch</h2>
                <div id="contact-links" class="social-links">
                    <!-- Injected via JS -->
                </div>
                <p class="copyright">&copy; <span id="year"></span> Zhiyang Hu. Built with pure Code.</p>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
